// Utils
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function p2(n){return('0'+n).slice(-2);}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dateStr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(key,n){var p=key.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return dateStr(d);}
function fmtDate(key){var p=key.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return WDAYS[d.getDay()]+', '+MONTHS[p[1]-1]+' '+p[2];}
function getPlan(key){var p=key.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),dow=d.getDay();return PLAN[dow===0?6:dow-1];}
function getInfo(dl,id){return(dl&&dl[id+'_info'])||{};}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadLog(){try{var r=localStorage.getItem('wt7');if(r){var p=JSON.parse(r);if(p&&typeof p==='object')return Object.assign({},RECOVERED,p);}}catch(e){}return Object.assign({},RECOVERED);}
function persist(){try{localStorage.setItem('wt7',JSON.stringify(S.log));return true;}catch(e){return false;}}
function getLastSess(exId){var dates=Object.keys(S.log).sort().reverse();for(var i=0;i<dates.length;i++){var d=dates[i];if(d===S.date)continue;var s=(S.log[d]||{})[exId];if(s&&s.length>0)return s;}return null;}
function mergeSwapped(ex,inf){return{id:ex.id,name:inf.name||ex.name,anc:ex.anc,ts:inf.ts2||ex.ts,tr:inf.tr2||ex.tr,sw:inf.sw2!=null?inf.sw2:ex.sw,swl:inf.sw2?null:'RPE 8',cue:ex.cue,rule:ex.rule,alts:ex.alts};}

// State
var S={screen:'today',date:todayKey(),log:loadLog(),expEx:null,expSec:null,modal:null,progEx:null,focusId:null};
document.getElementById('main').innerHTML='<div style="padding:20px;color:#16a34a;font-size:13px">Plan built. Rendering...</div>';

function nextDay(){S.date=addDays(S.date,1);S.expEx=null;S.expSec=null;render();}
function setScreen(s){S.screen=s;render();}
function toggleEx(id){S.expEx=S.expEx===id?null:id;render();}
function toggleSec(k){S.expSec=S.expSec===k?null:k;render();}
function toggleTread(){var dl=S.log[S.date]||{};S.log[S.date]=Object.assign({},dl,{_tread:!dl._tread});persist();render();}
function openMenu(id){S.modal={type:'action',exId:id};render();}
function openSkip(id){S.modal={type:'skip',exId:id};render();}
function openSwap(id){S.modal={type:'swap',exId:id};render();}
function openCSwap(id){S.modal={type:'cswap',exId:id};render();}
function openAdd(){S.modal={type:'add'};render();}
function openBackup(){S.modal={type:'backup'};render();}
function undoMeta(id){var dl=S.log[S.date]||{},p={};p[id+'_info']=null;p[id]=[];S.log[S.date]=Object.assign({},dl,p);persist();render();}
function removeCx(cid){if(!confirm('Remove this exercise from today?'))return;var dl=S.log[S.date]||{},p={_custom:(dl._custom||[]).filter(function(c){return c.id!==cid;})};p[cid]=[];S.log[S.date]=Object.assign({},dl,p);persist();render();}

function hOpenMenu(el){event.stopPropagation();openMenu(el.dataset.id);}

function hRemoveCx(el){event.stopPropagation();removeCx(el.dataset.id);}

function hDoSkip(el){

function hDoSwapAlt(el){

  p[exId+'_info']={swapped:1,name:alt.name,ts2:alt.ts,tr2:alt.tr,sw2:alt.sw||0,ts:Date.now()};

}
function hWkNav(el){S.date=el.dataset.date;S.screen='today';S.expEx=null;S.expSec=null;render();}

function logSet(exId){
  var wEl=document.getElementById('w_'+exId),rEl=document.getElementById('r_'+exId);
  if(!wEl||!rEl)return;
  var w=parseFloat(wEl.value),r=parseInt(rEl.value);
  if(isNaN(w)||w<=0||isNaN(r)||r<=0){
    wEl.style.borderColor='#f87171';rEl.style.borderColor='#f87171';
    setTimeout(function(){if(wEl)wEl.style.borderColor='';if(rEl)rEl.style.borderColor='';},700);
    return;
  }
  var dl=S.log[S.date]||{},cur=(dl[exId]||[]).slice();
  cur.push({weight:w,reps:r,ts:Date.now()});
  S.log[S.date]=Object.assign({},dl,{[exId]:cur});
  persist();S.focusId='w_'+exId;render();
}
function hLogSet(el){logSet(el.dataset.id);}
function hLogSetKey(el,e){if(e.key==='Enter'){e.preventDefault();logSet(el.dataset.id);}}

function copyBackup(){
  var ta=document.getElementById('bkta');if(!ta)return;
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(function(){});
  try{ta.select();document.execCommand('copy');}catch(e){}

  if(btn){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy All Data';},2000);}
}
function doRestore(){
  var ta=document.getElementById('rsta');if(!ta||!ta.value.trim())return;
  try{
    var p=JSON.parse(ta.value.trim());
    if(typeof p!=='object'||Array.isArray(p))throw new Error();
    S.log=p;persist();S.modal=null;render();
  }catch(ex){
    var e=document.getElementById('rserr');if(e)e.textContent='Invalid data. Paste the full backup text exactly as copied.';
  }

// --- HTML builders ---
function exCard(dx,c,logs,origName,isCustom,rawId){
  var isDone=logs.length>=dx.ts,expanded=S.expEx===dx.id;
  var last=getLastSess(dx.id);
  var sugW=logs.length>0?logs[logs.length-1].weight:(last&&last.length>0?last[0].weight:(dx.sw>0?dx.sw:''));
  var bc=isDone?c:(isCustom?'#16a34a':'#e8ddd0');
  var dotsH='';
  for(var i=0;i<dx.ts;i++){dotsH+='<span class="dot" style="background:'+(i<logs.length?c:'#e0d8cc')+'"></span>';}
  var metaH=dx.ts+'x'+dx.tr+(dx.sw>0?' - '+dx.sw+(dx.wl?' '+dx.wl+' lbs':' lbs'):(dx.swl?' - '+dx.swl:''))+(last&&last.length>0&&!expanded?' - last: '+last[0].weight+'lbs':'');
  var badgesH=(dx.anc?'<span class="badge" style="background:'+c+'22;color:'+c+'">ANCHOR</span>':'')+(origName?'<span class="badge bswp">SWAPPED</span>':'')+(isCustom?'<span class="badge badd">+ ADDED</span>':'');
  var menuH=isCustom?('<button class="mbtn" data-id="'+rawId+'" onclick="hRemoveCx(this)">x</button>'):(!origName?('<button class="mbtn" data-id="'+rawId+'" onclick="hOpenMenu(this)">...</button>'):'');
  var h='<div class="card" style="border-left-color:'+bc+'">';
  h+='<div class="ch" data-id="'+dx.id+'" onclick="hToggleEx(this)">';
  h+='<div class="cl"><div class="cn">'+esc(dx.name)+badgesH+'</div><div class="cm">'+metaH+'</div></div>';
  h+='<div class="cr"><div class="dots">'+dotsH+'</div>'+menuH+'<span class="chv">'+(expanded?'&utrif;':'&dtrif;')+'</span></div>';
  h+='</div>';
  if(expanded){
    h+='<div class="cb">';
    if(origName)h+='<div class="was">Swapped from: <strong>'+esc(origName)+'</strong> <button class="ub" data-id="'+rawId+'" onclick="hUndoMeta(this)">Undo swap</button></div>';
    if(dx.cue)h+='<div class="cue" style="border-left-color:'+c+'"><div class="clbl">COACHING CUE</div><div class="ctxt">'+esc(dx.cue)+'</div></div>';
    var q=encodeURIComponent(dx.name+' exercise proper form tutorial');
    h+='<a class="ytb" href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener"><div class="yti"><div class="ytt"></div></div><div><div class="ytl">Watch tutorial on YouTube</div><div class="yts">'+esc(dx.name)+' form and technique</div></div><span style="margin-left:auto;color:#78716c">&#8599;</span></a>';
    if(last&&last.length>0){h+='<div class="lr"><span class="ll">LAST SESSION:</span>';last.slice(0,dx.ts).forEach(function(s){h+='<span class="lc">'+s.weight+'x'+s.reps+'</span>';});h+='</div>';}
    h+='<div class="sets">';
    for(var i=0;i<dx.ts;i++){
      if(i<logs.length){h+='<div class="sr dr"><span class="sn">'+(i+1)+'</span><span class="sl2">'+logs[i].weight+' lbs x '+logs[i].reps+' reps</span><span style="color:'+c+'">&#10003;</span></div>';}
      else if(i===logs.length&&!isDone){h+='<div class="sr ar"><span class="sn" style="color:'+c+'">'+(i+1)+'</span><div class="si"><input type="number" inputmode="decimal" class="wi" id="w_'+dx.id+'" placeholder="lbs"'+(sugW?' value="'+sugW+'"':'')+' style="border-color:'+c+'80" data-id="'+dx.id+'" onkeydown="if(event.key===String.fromCharCode(13)){event.preventDefault();logSet(this.dataset.id)}"><span class="xs">x</span><input type="number" inputmode="numeric" class="ri" id="r_'+dx.id+'" placeholder="reps" style="border-color:'+c+'80" data-id="'+dx.id+'" onkeydown="if(event.key===String.fromCharCode(13)){event.preventDefault();logSet(this.dataset.id)}"><span class="ll2">lbs</span></div><button class="lbtn" style="background:'+c+'" data-id="'+dx.id+'" onclick="logSet(this.dataset.id)">&#10003;</button></div>';}
      else{h+='<div class="sr pr"><span class="sn">'+(i+1)+'</span><span style="color:#78716c">-</span></div>';}
    }
    h+='</div>';
    if(isDone)h+='<div class="db" style="background:'+c+'15;color:'+c+'">&#10003; Exercise Complete</div>';
    else if(dx.rule)h+='<div class="pr2"><span style="color:#16a34a;flex-shrink:0">&#8594;</span><span>'+esc(dx.rule)+'</span></div>';
    h+='</div>';
  }
  h+='</div>';
  return h;

function scard(title,sub,badge,key,c,items){
  var exp=S.expSec===key;
  var bH=badge?'<span class="scb" style="background:'+c+'25;color:'+c+'">'+badge+'</span>':'';
  var h='<div class="sc"><div class="sch" data-key="'+key+'" onclick="hToggleSec(this)"><div><div class="sct">'+esc(title)+'</div><div class="scs">'+esc(sub)+'</div></div><div class="scr">'+bH+'<span class="chv">'+(exp?'&utrif;':'&dtrif;')+'</span></div></div>';
  if(exp){h+='<div class="scbd">';items.forEach(function(it,i){h+='<div class="li"><span class="lin">'+(i+1)+'</span><span>'+esc(it)+'</span></div>';});h+='</div>';}
  h+='</div>';return h;
}

function buildToday(plan,dl){
  var c=plan.color,exs=plan.ex||[],cxl=dl._custom||[];
  var act=exs.filter(function(ex){return!getInfo(dl,ex.id).skipped;});
  var tot=act.length+cxl.length;
  var done=act.filter(function(ex){var inf=getInfo(dl,ex.id);var ts=inf.swapped&&inf.ts2?inf.ts2:ex.ts;return(dl[ex.id]||[]).length>=(ts||ex.ts);}).length+cxl.filter(function(cx){return(dl[cx.id]||[]).length>=cx.ts;}).length;
  var pct=tot?Math.round(done/tot*100):0;
  var h='<div class="hdr"><div class="hn"><button onclick="prevDay()">&#8249;</button><span class="hd">'+fmtDate(S.date)+'</span><button onclick="nextDay()">&#8250;</button></div>';
  h+='<div class="ht" style="color:'+c+'">'+esc(plan.name)+'</div><div class="hs">'+esc(plan.focus)+'</div>';
  if(tot>0)h+='<div class="pbw"><div class="pbf" style="width:'+pct+'%;background:'+c+'"></div></div><div class="pbt">'+done+'/'+tot+' exercises - '+pct+'% complete</div>';
  h+='</div><div class="scroll">';
  if(plan.pickle){
    h+='<div class="pc"><div style="font-size:19px;font-weight:700;color:#16a34a;margin-bottom:13px">Pickleball Day</div>';
    [['REPLACES','Legs B + all weekly cardio'],['BURN','800+ kcal per match'],['LEG WORK','Lateral movement, lunging, pivoting'],['CARDIO','Improves RHR and VO2 Max'],['PRE-MATCH','Eat 90 min before: carbs + protein'],['POST-MATCH','25-30g protein within 60 min']].forEach(function(r){h+='<div class="pr4"><div class="pk">'+r[0]+'</div><div class="pv">'+r[1]+'</div></div>';});
    h+='</div>';
  }else if(plan.rest){
    h+='<div style="padding:30px 20px;text-align:center"><div style="font-size:20px;font-weight:700;color:#78716c;margin-bottom:12px">Rest Day</div><div style="font-size:13px;color:#78716c;line-height:1.8">Muscles are built during rest. Hit your 175g protein anyway.</div></div>';
  }else{
    h+='<div class="tc"><div><div style="font-size:14px;font-weight:600;margin-bottom:2px">Treadmill Warm-Up</div><div style="font-size:11px;color:#9c9489">10 min walk/run - 130-145 bpm - conversational pace</div></div>';
    h+='<div class="cc" style="border-color:'+c+';background:'+(dl._tread?c:'transparent')+';color:#fff" onclick="toggleTread()">'+(dl._tread?'&#10003;':'')+'</div></div>';
    h+=scard('Warm-Up',plan.wu.length+' items - 5-10 min',null,'wu',c,plan.wu);
    h+='<div class="sl"><span>EXERCISES ('+exs.length+' planned'+(cxl.length?' + '+cxl.length+' added':'')+')</span><button class="ab" onclick="openAdd()">+ Add exercise</button></div>';
    exs.forEach(function(ex){
      var inf=getInfo(dl,ex.id);
      if(inf.skipped){h+='<div class="card" style="border-left-color:#78716c;opacity:.45"><div class="ch"><div class="cl"><div class="cn"><span style="text-decoration:line-through">'+esc(ex.name)+'</span><span class="badge bskp">SKIPPED</span></div><div class="cm" style="color:#78716c">'+esc(inf.reason||'')+'</div><button class="ub" style="margin-top:5px" data-id="'+ex.id+'" onclick="hUndoMeta(this)">Undo skip</button></div></div></div>';return;}
      var dx=inf.swapped?mergeSwapped(ex,inf):ex;
      h+=exCard(dx,c,dl[ex.id]||[],inf.swapped?ex.name:null,false,ex.id);
    });
    cxl.forEach(function(cx){h+=exCard(cx,'#16a34a',dl[cx.id]||[],null,true,cx.id);});
    if(plan.fin)h+=scard('Finisher - '+plan.fin.fmt,'After main work is complete','7 MIN','fin',c,plan.fin.moves);
    h+=scard('Cool-Down','5 min - always finish with this',null,'cd',c,plan.cool);
  }
  return h+'</div>';
}

function buildWeek(){
  var today=todayKey(),tp=today.split('-').map(Number),td=new Date(tp[0],tp[1]-1,tp[2]),dow=td.getDay();
  var mon=new Date(td);mon.setDate(td.getDate()+(dow===0?-6:1-dow));
  var h='<div class="shdr"><h2>This Week</h2></div><div class="scroll">';
  for(var i=0;i<7;i++){
    var dt=new Date(mon);dt.setDate(mon.getDate()+i);var date=dateStr(dt);
    var plan=getPlan(date),dl=S.log[date]||{};
    var done=(plan.ex||[]).filter(function(ex){return(dl[ex.id]||[]).length>=ex.ts;}).length;
    var tot=(plan.ex||[]).length,isToday=date===today,isActive=date===S.date;
    h+='<div class="wc" style="border-left-color:'+(isActive?plan.color:'#1e2433')+';background:'+(isActive?plan.color+'18':'#fffdf7')+'" data-date="'+date+'" onclick="hWkNav(this)">';
    h+='<div class="wd" style="color:'+plan.color+'">'+plan.day+'</div>';
    h+='<div class="wm"><div class="wn">'+plan.name+'</div><div class="wf">'+plan.focus+'</div>'+(tot>0&&done>0?'<div class="wb">'+done+'/'+tot+' done</div>':'')+'</div>';
    if(isToday)h+='<div class="tdot"></div>';
    h+='</div>';
  }
  return h+'</div>';
}

function buildHistory(){
  var h='<div class="shdr"><h2>History</h2></div><div class="scroll">',any=false;
  Object.keys(S.log).sort().reverse().slice(0,30).forEach(function(date){
    var plan=getPlan(date),dl=S.log[date]||{};
    var le=(plan.ex||[]).filter(function(ex){return(dl[ex.id]||[]).length>0;});
    var lc=(dl._custom||[]).filter(function(cx){return(dl[cx.id]||[]).length>0;});
    var all=le.concat(lc);if(!all.length)return;any=true;
    var tot=all.reduce(function(s,ex){return s+(dl[ex.id]||[]).length;},0);
    h+='<div class="hc" style="border-left:3px solid '+plan.color+'"><div class="hh"><div><div class="hdt">'+fmtDate(date)+'</div><div class="hwn" style="color:'+plan.color+'">'+plan.name+'</div></div><div style="text-align:right"><div class="hs2">'+tot+'</div><div class="hsl">sets</div></div></div>';
    all.forEach(function(ex){var sets=dl[ex.id]||[];var mw=Math.max.apply(null,[0].concat(sets.map(function(s){return s.weight||0;})));var best=sets.find(function(s){return s.weight===mw;});h+='<div class="he"><span class="hen">'+esc(ex.name)+'</span><span class="hed">'+sets.length+'x - best '+mw+'x'+(best?best.reps:'')+'</span></div>';});
    h+='</div>';
  });
  if(!any)h+='<div class="em">No workouts logged yet.<br>Log some sessions and history appears here.</div>';
  return h+'</div>';
}

function buildProgress(){
  var allEx=[];PLAN.forEach(function(day){(day.ex||[]).forEach(function(ex){if(!allEx.find(function(e){return e.id===ex.id;}))allEx.push(ex);});});
  Object.values(S.log).forEach(function(dl){(dl._custom||[]).forEach(function(cx){if(!allEx.find(function(e){return e.id===cx.id;}))allEx.push(cx);});});
  if(!S.progEx&&allEx.length)S.progEx=allEx[0].id;
  var selId=S.progEx||'',ex=allEx.find(function(e){return e.id===selId;});
  var sess=Object.keys(S.log).sort().reverse().filter(function(d){return(S.log[d][selId]||[]).length>0;}).slice(0,12);
  var mxE=0;sess.forEach(function(d){(S.log[d][selId]||[]).forEach(function(s){if((s.weight||0)>mxE)mxE=s.weight;});});
  var h='<div class="shdr"><h2>Progress</h2></div><div class="scroll">';
  h+='<select class="ep" onchange="setProgEx(this.value)">';
  allEx.forEach(function(e){h+='<option value="'+e.id+'"'+(e.id===selId?' selected':'')+'>'+esc(e.name)+'</option>';});
  h+='</select>';
  if(mxE>0&&ex)h+='<div style="padding:13px;background:#fffdf7;border-radius:12px;margin-bottom:12px;border:1px solid #e8ddd0"><div style="font-size:11px;color:#78716c;letter-spacing:1px;margin-bottom:5px">ALL-TIME BEST</div><div style="font-size:26px;font-weight:700;color:#16a34a">'+mxE+' lbs</div>'+(ex.sw>0?'<div style="font-size:12px;color:#78716c;margin-top:4px">Started at '+ex.sw+' lbs - +'+(mxE-ex.sw)+' lbs gained</div>':'')+'</div>';
  if(!sess.length){h+='<div class="em">No data yet for '+(ex?esc(ex.name):'this exercise')+'.<br>Log some sessions first.</div>';}
  else{
    h+='<div class="pt"><div class="pr3 ph"><span>DATE</span><span>SETS</span><span>BEST</span><span>VOL</span></div>';
    sess.forEach(function(date){var sets=S.log[date][selId]||[];var mw=Math.max.apply(null,[0].concat(sets.map(function(s){return s.weight||0;})));var best=sets.find(function(s){return s.weight===mw;});var vol=sets.reduce(function(s,set){return s+(set.weight||0)*(set.reps||0);},0);h+='<div class="pr3" style="background:#f5efe6"><span style="color:#78716c;font-size:11px">'+fmtDate(date)+'</span><span>'+sets.length+'x</span><span style="color:#16a34a">'+mw+'x'+(best?best.reps:'')+'</span><span style="color:#9c9489">'+vol+'</span></div>';});
    h+='</div>';
    if(ex&&ex.rule)h+='<div style="margin-top:11px;padding:11px 13px;background:#fffdf7;border-radius:11px;border:1px solid #e8ddd0"><div style="font-size:10px;letter-spacing:1px;color:#78716c;margin-bottom:5px">PROGRESSION RULE</div><div style="font-size:12px;color:#9c9489;line-height:1.7">'+esc(ex.rule)+'</div></div>';
  }
  return h+'</div>';
}

function buildNav(){
  var tabs=[['today','&#127947;','Today'],['week','&#128197;','Week'],['history','&#128203;','History'],['progress','&#128200;','Progress'],['backup','&#128190;','Backup']];
  return tabs.map(function(t){
    var on=S.screen===t[0]||(t[0]==='backup'&&S.modal&&S.modal.type==='backup');
    var fn=t[0]==='backup'?'openBackup()':'setScreen(this.dataset.scr)';
    return '<button class="ni" data-scr="'+t[0]+'" onclick="'+fn+'" style="color:'+(on?'#1c1917':'#9c9489')+'"><span class="nico">'+t[1]+'</span><span class="nlbl">'+t[2]+'</span></button>';
  }).join('');
}

function buildModal(plan){
  var m=S.modal,c=plan?plan.color:'#16a34a';
  if(m.type==='backup'){
    return '<div class="mc"><div class="mt">Backup &amp; Restore</div><div class="ft"><button id="etab" class="ftb on" data-tab="export" onclick="switchBTab(this.dataset.tab)">Export Data</button><button id="itab" class="ftb" data-tab="import" onclick="switchBTab(this.dataset.tab)">Restore Data</button></div><div id="btb">'+exportBody()+'</div><button class="scc" style="margin:10px 0 0" onclick="closeModal()">Close</button></div>';
  }
  if(m.type==='add'){
    return '<div class="mc"><div class="mt">Add Custom Exercise</div><div class="fr"><div class="fl">EXERCISE NAME</div><input type="text" id="add_name" placeholder="e.g. Cable Crunch"></div><div class="fg"><div class="fr"><div class="fl">SETS</div><input type="number" id="add_ts" value="3"></div><div class="fr"><div class="fl">REPS</div><input type="text" id="add_tr" value="10-12"></div></div><div class="fr"><div class="fl">START WEIGHT (optional)</div><input type="number" id="add_sw" placeholder="Leave blank for RPE"></div><div class="fa"><button class="fb s" onclick="closeModal()">Cancel</button><button class="fb p" onclick="doAdd()">Add Exercise</button></div></div>';
  }
  var exId=m.exId,ex=(plan&&plan.ex||[]).find(function(e){return e.id===exId;});
  if(!ex)return '';
  if(m.type==='action'){
    return '<div class="sheet"><div class="sh"></div><div class="st">'+esc(ex.name)+'</div><button class="sbtn" data-id="'+exId+'" onclick="hOpenSwap(this)"><span class="si2" style="background:#e8f4f4">&#8646;</span><span><span class="slb">Swap exercise</span><span class="ssb">Pick an alternative for the same muscle group</span></span></button><button class="sbtn d" data-id="'+exId+'" onclick="hOpenSkip(this)"><span class="si2" style="background:#fef2f2">&#10005;</span><span><span class="slb">Skip this exercise</span><span class="ssb">Mark as skipped with a reason</span></span></button><button class="scc" onclick="closeModal()">Cancel</button></div>';
  }
  if(m.type==='skip'){
    var reasons=[['Equipment unavailable or broken','&#128295;'],['Running out of time today','&#9203;'],['Too fatigued','&#128547;'],['Discomfort or soreness','&#129296;'],['Skipping - no specific reason','&#9197;']];
    var rH=reasons.map(function(r){return '<button class="ri2" data-id="'+exId+'" data-reason="'+esc(r[0])+'" onclick="hDoSkip(this)"><span class="rco">'+r[1]+'</span>'+esc(r[0])+'</button>';}).join('');
    return '<div class="sheet"><div class="sh"></div><div class="st">Skip '+esc(ex.name)+'?</div><div class="rl">'+rH+'</div><button class="scc" onclick="closeModal()">Cancel</button></div>';
  }
  if(m.type==='swap'){
    var altH=(ex.alts||[]).map(function(alt,i){return '<button class="ai" data-id="'+exId+'" data-idx="'+i+'" onclick="hDoSwapAlt(this)"><span class="an">'+esc(alt.name)+'</span><span class="am">'+alt.ts+'x'+alt.tr+'</span></button>';}).join('');
    altH+='<button class="ai ac" data-id="'+exId+'" onclick="hOpenCSwap(this)"><span class="an">Custom exercise...</span><span class="am">Enter your own</span></button>';
    return '<div class="sheet"><div class="sh"></div><div class="st">Swap '+esc(ex.name)+'</div><div class="al">'+altH+'</div><button class="scc" onclick="closeModal()">Cancel</button></div>';
  }
  if(m.type==='cswap'){
    return '<div class="mc"><div class="mt">Custom Swap</div><div class="fr"><div class="fl">EXERCISE NAME</div><input type="text" id="cs_name" placeholder="e.g. Dumbbell Chest Press"></div><div class="fg"><div class="fr"><div class="fl">SETS</div><input type="number" id="cs_ts" value="'+ex.ts+'"></div><div class="fr"><div class="fl">REPS</div><input type="text" id="cs_tr" value="'+ex.tr+'"></div></div><div class="fr"><div class="fl">START WEIGHT (optional)</div><input type="number" id="cs_sw"'+(ex.sw>0?' value="'+ex.sw+'"':'')+' placeholder="Optional"></div><div class="fa"><button class="fb s" data-id="'+exId+'" onclick="hOpenSwap(this)">Back</button><button class="fb p" onclick="doCustomSwap()">Swap In</button></div></div>';
  }
  return '';
}

function render(){
  try{
    var plan=getPlan(S.date),dl=S.log[S.date]||{};
    var main=document.getElementById('main');
    if(S.screen==='today')main.innerHTML=buildToday(plan,dl);
    else if(S.screen==='week')main.innerHTML=buildWeek();
    else if(S.screen==='history')main.innerHTML=buildHistory();
    else main.innerHTML=buildProgress();
    document.getElementById('nav').innerHTML=buildNav();
    var ov=document.getElementById('ov');
    if(S.modal){
      ov.style.display='flex';
      ov.className=(['add','backup','cswap'].indexOf(S.modal.type)>=0)?'ctr':'';
      ov.innerHTML=buildModal(plan);
    }else{ov.style.display='none';}
    if(S.focusId){var el=document.getElementById(S.focusId);if(el){setTimeout(function(){if(el){el.focus();try{el.select();}catch(e2){}}},50);}S.focusId=null;}
  }catch(err){
    var m=document.getElementById('main');
    if(m)m.innerHTML='<div style="padding:20px;color:#dc2626"><h3>Error loading app</h3><p style="font-size:12px;margin-top:8px;color:#78716c">'+esc(err.message||String(err))+'</p><p style="margin-top:10px;font-size:11px;color:#9c9489">Pull to refresh. Your data is safe in localStorage.</p></div>';
  }
}
render();
</script>
</body>
</html>
